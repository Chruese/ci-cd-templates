name: Next.js Universal Deploy

on:
  workflow_call:
    inputs:
      working-dir:
        description: "Directory containing the Next.js app"
        type: string
        default: "."
      node-version:
        description: "Node.js version to use"
        type: string
        default: "20.x"
      deploy-target:
        description: "Target environment: 'vm' or 'azure'"
        type: string
        default: "vm"
      vm-target-path:
        description: "Destination path on the Linux VM"
        type: string
        default: "/var/www/nextjs-app"
    secrets:
      # Required for Linux VM deployments
      SSH_HOST:
        required: false
      SSH_USER:
        required: false
      SSH_PRIVATE_KEY:
        required: false
      # Required for Azure deployments
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      AZURE_WEBAPP_NAME:
        required: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ inputs.working-dir }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit
        if: hashFiles('**/tsconfig.json') != ''

      - name: Build Next.js App
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            ${{ inputs.working-dir }}/.next
            ${{ inputs.working-dir }}/public
            ${{ inputs.working-dir }}/package.json
            ${{ inputs.working-dir }}/package-lock.json
            ${{ inputs.working-dir }}/next.config.*
            ${{ inputs.working-dir }}/ecosystem.config.js

  deploy-vm:
    name: Deploy to Linux VM
    needs: build
    if: inputs.deploy-target == 'vm'
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: ./app-deploy

      - name: Configure Native SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write SSH key from secrets and secure it
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Add host to known_hosts to bypass interactive prompts
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer Files to VM (Native rsync)
        run: |
          # rsync is more secure/efficient than scp and transfers hidden files (.next) reliably
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./app-deploy/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ inputs.vm-target-path }}/

      - name: Restart Application Service (Native SSH)
        run: |
          # Execute commands natively via SSH tunnel
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ inputs.vm-target-path }}
            npm ci --omit=dev
            pm2 reload ecosystem.config.js || pm2 start ecosystem.config.js
            pm2 save
          EOF

      - name: Security Cleanup
        if: always()
        run: |
          # Ensure the key is deleted even if the workflow fails
          rm -f ~/.ssh/deploy_key

  deploy-azure:
    name: Deploy to Azure Web App
    needs: build
    if: inputs.deploy-target == 'azure'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: ./app-deploy

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: ./app-deploy