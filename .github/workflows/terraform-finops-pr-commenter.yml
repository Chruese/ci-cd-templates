name: Terraform FinOps Check

on:
  workflow_call:
    inputs:
      working-dir:
        description: "Directory containing the Terraform code"
        type: string
        default: "."
    secrets:
      INFRACOST_API_KEY:
        required: true

jobs:
  infracost-check:
    name: Estimate Cloud Costs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to post the cost estimate comment

    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # Generate the cost estimate baseline based on the current Terraform code
      - name: Generate Infracost cost estimate baseline
        run: |
          infracost breakdown --path . \
                              --format json \
                              --out-file /tmp/infracost.json

      # Post the cost estimate comment to the PR (updates it if one already exists)
      - name: Post Infracost Comment
        uses: infracost/actions/comment@v3
        if: github.event_name == 'pull_request'
        with:
          path: /tmp/infracost.json
          behavior: update